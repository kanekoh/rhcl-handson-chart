---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- if .Values.image.buildFromSource }}
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "15"
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  source:
    type: Git
    git:
      uri: {{ .Values.gitops.repoUrl }}
      ref: {{ .Values.gitops.revision }}
    contextDir: {{ .Values.gitops.appPath }}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: {{ .Values.name }}:latest
  triggers:
    - type: ConfigChange
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      containers:
        - name: {{ .Values.name }}
          {{- if .Values.image.buildFromSource }}
          image: image-registry.openshift-image-registry.svc:5000/{{ .Values.namespace }}/{{ .Values.name }}:latest
          {{- else }}
          image: {{ .Values.image.prebuilt }}
          {{- end }}
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  selector:
    app: {{ .Values.name }}
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
{{- if .Values.rhdp.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-userinfo
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "35"
  labels:
    demo.redhat.com/userinfo: ""
data:
  title: {{ .Values.rhdp.title | quote }}
  instructions: {{ .Values.rhdp.instructions | quote }}
  gateway_hostname: {{ .Values.hostname | quote }}
  {{- if .Values.keycloak.enabled }}
  keycloak_url: {{ .Values.keycloakUrl | quote }}
  keycloak_realm: {{ .Values.keycloak.realm | quote }}
  {{- end }}
{{- end }}
