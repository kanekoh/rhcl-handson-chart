---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: workshop-gateway
  namespace: {{ .Values.gatewayNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    networking.istio.io/service-type: ClusterIP
  labels:
    kuadrant.io/gateway: "true"
spec:
  gatewayClassName: {{ .Values.gatewayClassName }}
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: {{ .Values.hostname | quote }}
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: workshop-gateway
  namespace: {{ .Values.gatewayNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "21"
spec:
  host: {{ .Values.hostname }}
  port:
    targetPort: http
  to:
    kind: Service
    name: workshop-gateway-istio
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.appNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  parentRefs:
    - name: workshop-gateway
      namespace: {{ .Values.gatewayNamespace }}
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.appName }}
          port: 8080
