# RHCL Hands-on Lab Environment - App of Apps
# 各コンポーネントは components/ 以下の独立サブチャートとしてデプロイされる

# --- GitOps ---
gitops:
  repoUrl: "https://github.com/kanekoh/rhcl-handson-chart.git"
  revision: main
  basePath: "."

  argocd:
    namespace: openshift-gitops
    project: default

# --- クラスタ情報 ---
# helm install 時はクラスタから自動検出（ingresses.config.openshift.io/cluster）
# RHDP 経由では AgnosticD ロールが自動注入
deployer:
  domain: ""
  apiUrl: ""

# --- Gateway API プロバイダ ---
# "istio"           : OSSM 3 + Istio Gateway Controller（OCP 4.18 以前）
# "openshift-default": OpenShift Ingress Operator（OCP 4.19 以降）
gatewayProvider: istio

# --- コンポーネント ---
components:

  # --- Operator インストール ---
  operators:
    enabled: true
    certManager:
      channel: stable-v1
    ossm:
      channel: stable
    rhcl:
      channel: stable
    keycloak:
      enabled: true
      channel: stable-v26

  # --- インフラ CR（Istio, Kuadrant） ---
  infra:
    enabled: true

  # --- サンプルアプリケーション ---
  app:
    enabled: true
    namespace: rhcl-handson
    name: echo-server
    hostname: ""        # 空の場合 echo.<cluster-domain> を自動生成
    replicas: 1
    image:
      buildFromSource: true
      prebuilt: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    rhdp:
      enabled: false
      applicationLabel: rhcl-handson
      title: "RHCL Hands-on Lab"
      instructions: "Showroom のラボガイドに従ってハンズオン演習を実施してください。"

  # --- Gateway ---
  gateway:
    enabled: true

  # --- Keycloak ---
  keycloak:
    enabled: true
    namespace: keycloak
    instances: 1
    realm:
      name: connectivity-link
      clients:
        browserApp:
          clientId: browser-app
        serviceAccount:
          clientId: service-account
      users:
        - username: testuser
          password: testpassword
          roles:
            - default-roles-connectivity-link
        - username: adminuser
          password: adminpassword
          roles:
            - default-roles-connectivity-link
            - admin

  # --- ポリシー（ハンズオン演習用、デフォルト無効） ---
  policies:
    enabled: false
    denyAll: false
    jwtAuth: false
    apikeyAuth: false
    apikeyValue: workshop-test-key-001
    globalRateLimit: false
    globalRateLimitRate: 5
    globalRateLimitWindow: 10s
    perUserRateLimit: false
    perUserRateLimitRate: 3
    perUserRateLimitWindow: 10s
    overrides: false
    overridesRate: 10
    overridesWindow: 10s
