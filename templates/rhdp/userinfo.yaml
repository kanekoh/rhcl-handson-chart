{{- if .Values.rhdp.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rhcl-handson-userinfo
  namespace: {{ .Values.app.namespace }}
  annotations:
    {{- include "rhcl.syncWave" "35" | nindent 4 }}
  labels:
    demo.redhat.com/userinfo: ""
data:
  title: {{ .Values.rhdp.title | quote }}
  instructions: {{ .Values.rhdp.instructions | quote }}
  gateway_hostname: {{ include "rhcl.gatewayHostname" . | quote }}
  cluster_domain: {{ include "rhcl.clusterDomain" . | quote }}
  {{- if .Values.keycloak.enabled }}
  keycloak_url: {{ include "rhcl.keycloakUrl" . | quote }}
  keycloak_realm: {{ .Values.keycloak.realm.name | quote }}
  {{- end }}
{{- end }}
