{{- if .Values.policies.denyAll }}
---
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: deny-all
  namespace: {{ include "rhcl.gatewayNamespace" . }}
  annotations:
    {{- include "rhcl.syncWave" "30" | nindent 4 }}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: workshop-gateway
  defaults:
    rules:
      authorization:
        opa-deny:
          opa:
            rego: "allow = false"
{{- end }}
