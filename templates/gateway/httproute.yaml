---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Values.app.namespace }}
  annotations:
    {{- include "rhcl.syncWave" "25" | nindent 4 }}
spec:
  parentRefs:
    - name: workshop-gateway
      namespace: {{ include "rhcl.gatewayNamespace" . }}
  hostnames:
    - {{ include "rhcl.gatewayHostname" . | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.app.name }}
          port: 8080
