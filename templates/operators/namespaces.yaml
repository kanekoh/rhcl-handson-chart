---
apiVersion: v1
kind: Namespace
metadata:
  name: kuadrant-system
  annotations:
    {{- include "rhcl.syncWave" "0" | nindent 4 }}
  labels:
    {{- include "rhcl.rhdpLabel" . | nindent 4 }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager-operator
  annotations:
    {{- include "rhcl.syncWave" "0" | nindent 4 }}
{{- if eq .Values.gatewayProvider "istio" }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
  annotations:
    {{- include "rhcl.syncWave" "0" | nindent 4 }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: istio-cni
  annotations:
    {{- include "rhcl.syncWave" "0" | nindent 4 }}
{{- end }}
{{- if .Values.keycloak.enabled }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.keycloak.namespace }}
  annotations:
    {{- include "rhcl.syncWave" "0" | nindent 4 }}
{{- end }}
