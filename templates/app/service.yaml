---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Values.app.namespace }}
  annotations:
    {{- include "rhcl.syncWave" "15" | nindent 4 }}
spec:
  selector:
    app: {{ .Values.app.name }}
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
